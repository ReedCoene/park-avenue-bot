# Slack app manifest for the Park Avenue bot.
#
# Use it at https://api.slack.com/apps -> "Create New App" -> "From a manifest".
# This sets up Socket Mode, the bot user, all permissions, and event subscriptions
# in one step, so none of that has to be clicked in by hand.
#
# It does NOT create the two tokens — Slack only issues those after the app exists.
# See the setup steps for that part.

display_information:
  name: Park Avenue Bot
  description: QuickBooks and Fishbowl helper for Park Avenue Wholesale
  background_color: "#1f3a5f"

features:
  bot_user:
    display_name: Park Avenue Bot
    always_online: false
  app_home:
    # Without this block Slack creates the app with DMs disabled, and typing in the
    # bot's message box fails with "Sending messages to this app has been turned off."
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read   # see @mentions of the bot
      - chat:write          # post replies
      - im:history          # read direct messages sent to it
      - im:read             # see DM conversations
      - im:write            # open a DM back

settings:
  event_subscriptions:
    bot_events:
      - app_mention         # someone @mentions the bot in a channel
      - message.im          # someone DMs the bot
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true   # bot connects out from your PC; no public URL needed
  token_rotation_enabled: false
