<!DOCTYPE html>
<html>
<head>
  <title>QuickBooks Auth</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 600px; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    .box { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 20px; border-radius: 8px; margin-top: 20px; }
    .label { font-size: 12px; color: #555; margin-bottom: 4px; }
    .val { font-size: 14px; word-break: break-all; font-family: monospace; }
  </style>
</head>
<body>
  <h2>&#10003; QuickBooks Authorization</h2>
  <div class="box" id="out">Loading...</div>
  <script>
    const p = new URLSearchParams(window.location.search);
    const code = p.get('code');
    const realm = p.get('realmId');
    const out = document.getElementById('out');
    if (code) {
      out.innerHTML = `
        <div class="label">Code (copy this):</div>
        <div class="val">${code}</div>
        <br>
        <div class="label">Realm ID:</div>
        <div class="val">${realm || 'n/a'}</div>
        <br>
        <div class="label">Full URL (paste into terminal):</div>
        <div class="val">${window.location.href}</div>
      `;
    } else {
      out.innerHTML = '<p style="color:red">No code found. Check the URL.</p>';
    }
  </script>
</body>
</html>
